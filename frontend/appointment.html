<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Appointment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f5f7fa;
}

.navbar-brand{
font-weight:bold;
}

.appointment-card{
max-width:700px;
margin:50px auto;
padding:30px;
background:white;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

h2{
text-align:center;
margin-bottom:25px;
}

.btn-primary{
width:100%;
}

</style>

</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

<div class="container">

<a class="navbar-brand" href="index.html">
🏥 HMS
</a>

</div>

</nav>

<div class="container">

<div class="appointment-card">

<h2>Book Appointment</h2>

<form id="appointmentForm">

<div class="mb-3">
<label class="form-label">
Patient Name
</label>

<input
type="text"
class="form-control"
id="patientName"
required>
</div>

<div class="mb-3">
<label class="form-label">
Doctor
</label>

<select
class="form-select"
id="doctor"
required>

<option value="">
Select Doctor
</option>

<option>
Dr. Sharma - Cardiologist
</option>

<option>
Dr. Singh - Neurologist
</option>

<option>
Dr. Verma - Orthopedic
</option>

<option>
Dr. Gupta - Dermatologist
</option>

</select>

</div>

<div class="mb-3">
<label class="form-label">
Appointment Date
</label>

<input
type="date"
class="form-control"
id="date"
required>

</div>

<div class="mb-3">

<label class="form-label">
Time Slot
</label>

<select
class="form-select"
id="time"
required>

<option value="">
Select Time
</option>

<option>
09:00 AM
</option>

<option>
11:00 AM
</option>

<option>
02:00 PM
</option>

<option>
04:00 PM
</option>

</select>

</div>

<button
type="submit"
class="btn btn-primary">

Book Appointment

</button>

</form>

</div>

</div>

<script>

document
.getElementById("appointmentForm")
.addEventListener("submit",(e)=>{

e.preventDefault();

const appointment = {

patientName:
document.getElementById("patientName").value,

doctor:
document.getElementById("doctor").value,

date:
document.getElementById("date").value,

time:
document.getElementById("time").value

};

let appointments =
JSON.parse(
localStorage.getItem("appointments")
) || [];

appointments.push(appointment);

fetch("http://localhost:5000/api/appointments", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify(appointment)
});

alert("Appointment Booked Successfully");

document
.getElementById("appointmentForm")
.reset();

});

</script>

</body>
</html>
