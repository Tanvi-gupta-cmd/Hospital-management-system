<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Hospital Management System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f5f7fa;
}

.sidebar{
height:100vh;
background:#0d6efd;
color:white;
padding:20px;
position:fixed;
width:250px;
}

.sidebar h2{
text-align:center;
margin-bottom:30px;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:10px;
margin:10px 0;
border-radius:5px;
}

.sidebar a:hover{
background:rgba(255,255,255,.2);
}

.main-content{
margin-left:270px;
padding:30px;
}

.card-box{
padding:20px;
border-radius:15px;
background:white;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;
}

.table-container{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
margin-top:30px;
}

@media(max-width:768px){

.sidebar{
position:relative;
width:100%;
height:auto;
}

.main-content{
margin-left:0;
}

}

</style>

</head>
<body>

<div class="sidebar">

<h2>🏥 HMS</h2>

<a href="index.html">Home</a>
<a href="appointment.html">Book Appointment</a>
<a href="login.html">Logout</a>

</div>

<div class="main-content">

<div class="row">

<div class="col-md-4">

<div class="card-box">

<h5>Total Appointments</h5>

<h2 id="totalAppointments">
0
</h2>

</div>

</div>

</div>

<div class="table-container">

<h3 class="mb-4">
Appointment Records
</h3>

<div class="table-responsive">

<table class="table table-bordered">

<thead class="table-primary">

<tr>
<th>Patient</th>
<th>Doctor</th>
<th>Date</th>
<th>Time</th>
<th>Action</th>
</tr>

</thead>

<tbody id="appointmentTable">
</tbody>

</table>

</div>

</div>

</div>

<script>

let appointments =
JSON.parse(
localStorage.getItem("appointments")
) || [];

document.getElementById(
"totalAppointments"
).innerText = appointments.length;

const table =
document.getElementById(
"appointmentTable"
);

function loadAppointments(){

table.innerHTML = "";

appointments.forEach((appointment,index)=>{

table.innerHTML += `

<tr>

<td>${appointment.patientName}</td>

<td>${appointment.doctor}</td>

<td>${appointment.date}</td>

<td>${appointment.time}</td>

<td>

<button
class="btn btn-danger btn-sm"
onclick="deleteAppointment(${index})">

Delete

</button>

</td>

</tr>

`;

});

}

function deleteAppointment(index){

appointments.splice(index,1);

localStorage.setItem(
"appointments",
JSON.stringify(appointments)
);

document.getElementById(
"totalAppointments"
).innerText = appointments.length;

loadAppointments();

}

loadAppointments();

</script>

</body>
</html>
